server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（构建产物已含 .gz，开启 gzip_static 优先使用）
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 本地字体（woff2 子集）：内容稳定但文件名不含 hash，
    # 用中等时长缓存，字体更新后最长 7 天自愈
    location /font/ {
        expires 7d;
    }

    # 本地壁纸与站点图标：文件名固定，替换图片后同样最长 7 天自愈
    location /images/ {
        expires 7d;
    }

    # sw.js 不缓存：Service Worker 更新检测依赖每次拉取到最新文件
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # PWA manifest 短缓存
    location = /manifest.webmanifest {
        expires 1d;
    }

    # 入口文件不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
